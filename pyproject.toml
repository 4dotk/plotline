[project]
name = "plotline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "4dotk", email = "131266273+4dotk@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-openai>=1.7.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
plotline = "plotline:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-7s %(name)-21s %(message)s"
log_cli_date_format = "%H:%M:%S"
